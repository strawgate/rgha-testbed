# rgha config for this testbed. Run from the repo root:
#   GITHUB_TOKEN=$(gh auth token) rgha run --config controller/rgha.toml --metrics-addr 127.0.0.1:9464
# or with the container image (see README).

[github]
url = "https://github.com/strawgate/rgha-testbed"
token_env = "GITHUB_TOKEN"

[backends.modal]
type = "modal"
app = "rgha-testbed"
# Bake common actions and toolchains into the image: no downloads per job.
[backends.modal.preload]
actions = ["actions/checkout@v5", "actions/setup-node@v5", "actions/setup-python@v6"]
node = ["22"]
python = ["3.12"]

[backends.modal-vm]
type = "modal"
app = "rgha-testbed"
runtime = "vm"
docker = true

# Shell jobs, PRs from anyone: tiny, warm, GitHub-only egress.
[[class]]
name = "rgha-tiny"
backend = "modal"
cpu = 0.125              # billed floor while idle...
cpu_limit = 2.0          # ...burst to 2 cores (billed on usage)
memory_mib = 256
memory_limit_mib = 2048
max_runners = 12
min_idle = 0             # floor: scale to zero when quiet
warm_max = 4             # adaptive: +1 warm runner/min while jobs start cold, -1 per 5 min quiet
max_job_minutes = 10
network = "github-only"
[class.policy]
trust = "untrusted"

# Toolchains + package registries; same-repo PRs only (forks use rgha-tiny).
[[class]]
name = "rgha-small"
backend = "modal"
cpu = 0.125
cpu_limit = 2.0
memory_mib = 256
memory_limit_mib = 4096
max_runners = 6
warm_max = 2
max_job_minutes = 15
network = "allowlist"
allow_domains = [
  "raw.githubusercontent.com",
  "release-assets.githubusercontent.com",
  "registry.npmjs.org",
  "nodejs.org",
  "pypi.org",
  "files.pythonhosted.org",
]
[class.policy]
trust = "untrusted"
allow_fork_prs = false

# Docker (builds, container jobs, services) for code already on a branch.
[[class]]
name = "rgha-docker"
backend = "modal-vm"
cpu = 0.125
cpu_limit = 2.0
memory_mib = 512
memory_limit_mib = 4096
max_runners = 4
warm_max = 1
allow_warm_trusted = true  # testbed: accepts the warm-pool race until the job hook (#9)
max_job_minutes = 20
network = "open"
[class.policy]
trust = "trusted"
allowed_repos = ["strawgate/rgha-testbed"]
