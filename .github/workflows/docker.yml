# Docker on the trusted VM-runtime class: image builds, container jobs and
# service containers. Only runs for code already on main (trusted class).
name: docker
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "controller/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: rgha-docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t testbed:ci docker/
      - run: docker run --rm testbed:ci
  services:
    runs-on: rgha-docker
    timeout-minutes: 15
    container: python:3.12-slim
    services:
      redis:
        image: redis:7-alpine
    steps:
      - name: Talk to the redis service container
        run: |
          python - <<'PY'
          import socket
          s = socket.create_connection(("redis", 6379), timeout=10)
          s.sendall(b"PING\r\n")
          reply = s.recv(64)
          print(reply)
          assert reply.startswith(b"+PONG")
          PY
