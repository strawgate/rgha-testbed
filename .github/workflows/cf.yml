# Jobs for runners started on Cloudflare Containers (strawgate/rgha#42).
# Start one runner per job first (rgha/cloudflare/scripts/start-runner.sh).
name: cf
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [smoke, cpu-single, cpu-parallel]
        default: smoke
      jobs:
        description: JSON list, one entry per job
        default: "[1]"
permissions:
  contents: read
jobs:
  run:
    strategy:
      matrix:
        n: ${{ fromJSON(inputs.jobs) }}
    runs-on: rgha-cf
    steps:
      - uses: actions/checkout@v5
      - run: echo "runner=$RUNNER_NAME uptime=$(cut -d' ' -f1 /proc/uptime)s"; nproc; free -m
      - name: CPU time so far (whole VM)
        run: |
          echo "uptime=$(cut -d' ' -f1 /proc/uptime)"; head -1 /proc/stat
          cat /sys/fs/cgroup/cpu.stat 2>/dev/null | head -3 || true
      - name: /dev/shm (missing on Cloudflare Containers)
        run: |
          ls -ld /dev/shm || true; id; mount | grep -E " / | /dev " || true
          if ! [ -w /dev/shm ]; then sudo mkdir -p /dev/shm && sudo mount -t tmpfs -o mode=1777 tmpfs /dev/shm; fi
          ls -ld /dev/shm
      - if: inputs.suite != 'smoke'
        uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - if: inputs.suite == 'cpu-single'
        run: python cpu/burn.py 6 1
      - if: inputs.suite == 'cpu-parallel'
        run: python cpu/burn.py 24 4
      - name: CPU time at end (whole VM)
        if: always()
        run: |
          echo "uptime=$(cut -d' ' -f1 /proc/uptime)"; head -1 /proc/stat
          cat /sys/fs/cgroup/cpu.stat 2>/dev/null | head -3 || true
