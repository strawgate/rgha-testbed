# Diagnostics: the job environment on a given runner.
name: env
on:
  workflow_dispatch:
    inputs:
      runner: { default: rgha-light }
permissions: {}
jobs:
  env:
    runs-on: ${{ inputs.runner }}
    steps:
      - run: |
          id; echo "HOME=$HOME"; env | sort | grep -vE "^(GITHUB_TOKEN|ACTIONS_RUNTIME_TOKEN|ACTIONS_ID_TOKEN)" | grep -iE "root|python|^PATH=|^HOME|modal" || true
          sudo -n true && echo "sudo ok"
          python --version; ls -ld /root
