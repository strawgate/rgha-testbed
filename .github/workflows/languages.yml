# Real toolchains and package registries on an untrusted class whose egress
# is an allowlist (GitHub + npm + PyPI).
name: languages
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "controller/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: rgha-small
    timeout-minutes: 10
    defaults: { run: { working-directory: node } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
  python:
    runs-on: rgha-small
    timeout-minutes: 10
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
