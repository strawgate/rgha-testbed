# Dumps the runner's own diagnostic timeline from inside the sandbox, to see
# where cold-start time goes (sandbox boot vs .NET start vs broker session).
name: boot-profile
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label
        default: rgha-tiny
permissions:
  contents: read
jobs:
  profile:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Network latency to GitHub (connect / TLS / total, seconds)
        run: |
          for host in api.github.com broker.actions.githubusercontent.com pipelinesghubeus1.actions.githubusercontent.com results-receiver.actions.githubusercontent.com; do
            for i in 1 2 3; do
              curl -s -o /dev/null -w "$host %{time_connect} %{time_appconnect} %{time_total}\n" "https://$host/" || true
            done
          done | awk '{c[$1]+=$2; t[$1]+=$3; n[$1]++} END {for (h in c) printf "RTT %-55s connect=%.3f tls=%.3f\n", h, c[h]/n[h], t[h]/n[h]}'
      - name: Timeline
        run: |
          echo "step_now=$(date -u +%FT%T.%3NZ) uptime=$(cut -d' ' -f1 /proc/uptime)s"
          echo "pid1: $(ps -o lstart= -p 1) | $(tr '\0' ' ' < /proc/1/cmdline)"
          cd /home/runner/_diag
          ls -la
          echo "--- Runner log (key lines)"
          grep -h -E "Runner.Listener|Version:|Commit:|Culture|Starting|start|session|Session|Listening|Connected|message|Message|job|Job|Worker" Runner_*.log | cut -c1-220 | head -80
          echo "--- Worker log head"
          head -15 Worker_*.log | cut -c1-200
