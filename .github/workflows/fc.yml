# Jobs on the Firecracker backend (strawgate/rgha#21): shell, toolchains, and
# the runner/VM boot profile.
name: fc
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: rgha-fc
    steps:
      - uses: actions/checkout@v5
      - run: |
          echo "runner=$RUNNER_NAME"; uname -r; nproc; free -m
          cat /proc/cpuinfo | grep -m1 'model name'
          curl -fsS -o /dev/null -w 'api.github.com %{http_code}\n' https://api.github.com
          if curl -fsS --max-time 3 http://10.0.0.1 -o /dev/null; then echo "::error::private range reachable"; exit 1; fi
          echo "private ranges blocked"
  node:
    runs-on: rgha-fc
    defaults: { run: { working-directory: node } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
  python:
    runs-on: rgha-fc
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
